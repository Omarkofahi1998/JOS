<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JO Students - المنصة التعليمية للمتقدمين للامتحانات التنافسية</title>
    <meta name="description" content="منصة JO Students المتكاملة لدعم المتقدمين للامتحانات التنافسية في الأردن. توفر امتحانات تجريبية، مصادر تعليمية، وتغطية شاملة لكافة التخصصات." />
    
    <!-- Security Headers (Meta Tags for CSP where applicable in static env) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
    
    <!-- Preconnect to critical domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://i.ibb.co">
    
    <!-- Optimize Font Loading -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    </noscript>

    <!-- Preload LCP Image (Note: We usually get the URL from settings, but we can hint the domain) -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
